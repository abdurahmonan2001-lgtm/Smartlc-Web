  <polyline points="70,93.3 160,198.3 250,261.3 340,273 430,284.7 520,296.3 610,301" fill="none" stroke="#1d3a6b" stroke-width="2.5"/><circle cx="70" cy="93.3" r="3" fill="#1d3a6b"/><circle cx="160" cy="198.3" r="3" fill="#1d3a6b"/><circle cx="250" cy="261.3" r="3" fill="#1d3a6b"/><circle cx="340" cy="273" r="3" fill="#1d3a6b"/><circle cx="430" cy="284.7" r="3" fill="#1d3a6b"/><circle cx="520" cy="296.3" r="3" fill="#1d3a6b"/><circle cx="610" cy="301" r="3" fill="#1d3a6b"/>
  <polyline points="250,140 340,198.3 430,219.3 520,231 610,240.3" fill="none" stroke="#009472" stroke-width="2.5" stroke-dasharray="7 4"/><circle cx="250" cy="140" r="3" fill="#009472"/><circle cx="340" cy="198.3" r="3" fill="#009472"/><circle cx="430" cy="219.3" r="3" fill="#009472"/><circle cx="520" cy="231" r="3" fill="#009472"/><circle cx="610" cy="240.3" r="3" fill="#009472"/>
  <polyline points="70,305.7 160,303.3 250,298.7 340,296.3 430,289.3 520,273 610,193.7" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 4"/><circle cx="70" cy="305.7" r="3" fill="#c0392b"/><circle cx="160" cy="303.3" r="3" fill="#c0392b"/><circle cx="250" cy="298.7" r="3" fill="#c0392b"/><circle cx="340" cy="296.3" r="3" fill="#c0392b"/><circle cx="430" cy="289.3" r="3" fill="#c0392b"/><circle cx="520" cy="273" r="3" fill="#c0392b"/><circle cx="610" cy="193.7" r="3" fill="#c0392b"/>
