    <line x1="70" y1="303.3" x2="610" y2="303.3" stroke="#eee"/><text x="60" y="307.3" text-anchor="end">20</text>
    <line x1="70" y1="256.7" x2="610" y2="256.7" stroke="#eee"/><text x="60" y="260.7" text-anchor="end">40</text>
