<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="Arial, sans-serif">
  <rect width="660" height="420" fill="#ffffff"/>
  <text x="330" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">People visiting the cinema at least once a month, by age group (%)</text>

  <line x1="70" y1="350" x2="610" y2="350" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="350" x2="70" y2="55" stroke="#333" stroke-width="1.5"/>
  <g font-size="11" fill="#555">
    <line x1="70" y1="70" x2="610" y2="70" stroke="#eee"/><text x="60" y="74" text-anchor="end">100</text>
    <line x1="70" y1="126" x2="610" y2="126" stroke="#eee"/><text x="60" y="130" text-anchor="end">80</text>
    <line x1="70" y1="182" x2="610" y2="182" stroke="#eee"/><text x="60" y="186" text-anchor="end">60</text>
    <line x1="70" y1="238" x2="610" y2="238" stroke="#eee"/><text x="60" y="242" text-anchor="end">40</text>
    <line x1="70" y1="294" x2="610" y2="294" stroke="#eee"/><text x="60" y="298" text-anchor="end">20</text>
    <text x="60" y="354" text-anchor="end">0</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="368">1978</text><text x="250" y="368">1988</text><text x="430" y="368">1998</text><text x="610" y="368">2008</text>
  </g>

  <!-- 14-24: 90,88,90,90 -->
  <polyline points="70,98 250,104 430,98 610,98" fill="none" stroke="#1d3a6b" stroke-width="2.5"/>
  <!-- 25-34: 80,60,75,75 -->
  <polyline points="70,126 250,182 430,140 610,140" fill="none" stroke="#009472" stroke-width="2.5" stroke-dasharray="7 4"/>
  <!-- 35-49: 60,50,70,70 -->
  <polyline points="70,182 250,210 430,154 610,154" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 4"/>
  <!-- 50+: 40,30,50,50 -->
  <polyline points="70,238 250,266 430,210 610,210" fill="none" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="10 3 2 3"/>

  <g font-size="12" fill="#000">
    <line x1="80" y1="44" x2="106" y2="44" stroke="#1d3a6b" stroke-width="2.5"/><text x="111" y="48">14–24</text>
    <line x1="175" y1="44" x2="201" y2="44" stroke="#009472" stroke-width="2.5" stroke-dasharray="7 4"/><text x="206" y="48">25–34</text>
    <line x1="270" y1="44" x2="296" y2="44" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 4"/><text x="301" y="48">35–49</text>
    <line x1="365" y1="44" x2="391" y2="44" stroke="#8e44ad" stroke-width="2.5" stroke-dasharray="10 3 2 3"/><text x="396" y="48">50 and over</text>
  </g>
</svg>
