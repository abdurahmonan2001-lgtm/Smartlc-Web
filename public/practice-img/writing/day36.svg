<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Arial, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">Olive oil production</text>
  <g fill="#000">
    <rect x="520" y="50" width="150" height="70" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="534" cy="64" r="10" fill="#1d3a6b"/><text x="534" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>    <text x="603" y="70" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Collecting</text><text x="603" y="83" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">the olives</text>
    <text x="595" y="104" text-anchor="middle" font-size="10.5" fill="#000">(raked from the trees)</text>
    <line x1="518" y1="85" x2="482" y2="85" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="330" y="50" width="150" height="70" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="344" cy="64" r="10" fill="#1d3a6b"/><text x="344" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>    <text x="413" y="70" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Storing</text>
    <text x="405" y="90" text-anchor="middle" font-size="10.5" fill="#000">in a vat</text><text x="405" y="103" text-anchor="middle" font-size="10.5" fill="#000">2 to 3 days</text>
    <line x1="328" y1="85" x2="292" y2="85" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="140" y="50" width="150" height="70" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="154" cy="64" r="10" fill="#1d3a6b"/><text x="154" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>    <text x="223" y="70" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Washing</text>
    <text x="215" y="90" text-anchor="middle" font-size="10.5" fill="#000">with cool water</text>
    <line x1="138" y1="85" x2="105" y2="85" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <path d="M105,85 L60,85 L60,150" fill="none" stroke="#333" stroke-width="1.4"/>
    <line x1="60" y1="140" x2="60" y2="158" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="10" y="160" width="170" height="80" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="24" cy="174" r="10" fill="#1d3a6b"/><text x="24" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>    <text x="103" y="180" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Crushing</text>
    <text x="95" y="200" text-anchor="middle" font-size="10.5" fill="#000">by hammers;</text><text x="95" y="213" text-anchor="middle" font-size="10.5" fill="#000">makes olive paste</text>
    <line x1="95" y1="242" x2="95" y2="272" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="95" y="288" text-anchor="middle" font-size="10.5" fill="#000">Olive stones → container</text>
    <line x1="182" y1="200" x2="262" y2="200" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="222" y="192" text-anchor="middle" font-size="10" fill="#000">olive paste</text>
    <rect x="265" y="160" width="190" height="80" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="279" cy="174" r="10" fill="#1d3a6b"/><text x="279" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text>    <text x="368" y="180" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Pressing and</text><text x="368" y="193" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">filtering</text>
    <text x="360" y="222" text-anchor="middle" font-size="10.5" fill="#000">hydraulic press and filters</text>
    <line x1="457" y1="200" x2="512" y2="200" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="485" y="192" text-anchor="middle" font-size="10" fill="#000">oil</text>
    <rect x="515" y="160" width="155" height="80" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="529" cy="174" r="10" fill="#1d3a6b"/><text x="529" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6</text>    <text x="600.5" y="180" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Spinning and</text><text x="600.5" y="193" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">separating</text>
    <text x="592" y="222" text-anchor="middle" font-size="10.5" fill="#000">in a centrifuge</text>
    <line x1="592" y1="242" x2="592" y2="272" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="592" y="288" text-anchor="middle" font-size="10.5" fill="#000">Water removed</text>
    <path d="M535,242 L535,330" fill="none" stroke="#333" stroke-width="1.4"/>
    <line x1="535" y1="330" x2="457" y2="330" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <text x="495" y="322" text-anchor="middle" font-size="10" fill="#000">oil</text>
    <rect x="265" y="300" width="190" height="60" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="279" cy="314" r="10" fill="#1d3a6b"/><text x="279" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">7</text>    <text x="368" y="320" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Bottling</text>
    <line x1="263" y1="330" x2="182" y2="330" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="10" y="300" width="170" height="60" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><circle cx="24" cy="314" r="10" fill="#1d3a6b"/><text x="24" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>    <text x="103" y="320" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">Transporting</text><text x="103" y="333" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">to store</text>
    <text x="95" y="352" text-anchor="middle" font-size="10.5" fill="#000">by lorry</text>
  </g>
</svg>
