    <line x1="370" y1="152" x2="370" y2="182" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>    <text x="370" y="200" text-anchor="middle" font-size="11" fill="#000">Steel cans</text><text x="370" y="213" text-anchor="middle" font-size="11" fill="#000">and iron</text>    <line x1="370" y1="236" x2="370" y2="300" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>    <path d="M348,312 L348,336 L392,336 L392,312" fill="none" stroke="#333" stroke-width="1.4"/><ellipse cx="370" cy="312" rx="20" ry="6" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="370" y="356" text-anchor="middle" font-size="11" fill="#000">Collector</text>
    <line x1="480" y1="152" x2="480" y2="182" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>    <text x="480" y="200" text-anchor="middle" font-size="11" fill="#000">Glass, food,</text><text x="480" y="213" text-anchor="middle" font-size="11" fill="#000">non-ferrous metals</text>    <line x1="480" y1="236" x2="480" y2="300" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>    <path d="M458,312 L458,336 L502,336 L502,312" fill="none" stroke="#333" stroke-width="1.4"/><ellipse cx="480" cy="312" rx="20" ry="6" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="480" y="356" text-anchor="middle" font-size="11" fill="#000">Collector</text>
    <line x1="590" y1="152" x2="590" y2="182" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>    <text x="590" y="200" text-anchor="middle" font-size="11" fill="#000">Aluminium, wood,</text><text x="590" y="213" text-anchor="middle" font-size="11" fill="#000">rubber, plastic</text>    <line x1="590" y1="236" x2="590" y2="300" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>    <path d="M568,312 L568,336 L612,336 L612,312" fill="none" stroke="#333" stroke-width="1.4"/><ellipse cx="590" cy="312" rx="20" ry="6" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="590" y="356" text-anchor="middle" font-size="11" fill="#000">Collector</text>
