<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Arial, sans-serif">
  <rect width="680" height="380" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">How waste is sorted for recycling</text>
  <g fill="#000">
    <text x="70" y="120" text-anchor="middle" font-size="11" fill="#000">Glass, food,</text><text x="70" y="133" text-anchor="middle" font-size="11" fill="#000">steel cans, iron,</text><text x="70" y="146" text-anchor="middle" font-size="11" fill="#000">non-ferrous metals,</text><text x="70" y="159" text-anchor="middle" font-size="11" fill="#000">wood, aluminium</text>
    <path d="M130,150 L660,150" fill="none" stroke="#333" stroke-width="1.4"/>
    <line x1="130" y1="150" x2="145" y2="150" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="128" y="128" width="44" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="150" y="98" text-anchor="middle" font-size="11" fill="#000">Shredder</text>
    <rect x="238" y="128" width="44" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="260" y="98" text-anchor="middle" font-size="11" fill="#000">Primary air</text><text x="260" y="111" text-anchor="middle" font-size="11" fill="#000">classifier</text>
    <rect x="348" y="128" width="44" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="370" y="98" text-anchor="middle" font-size="11" fill="#000">Magnetic</text><text x="370" y="111" text-anchor="middle" font-size="11" fill="#000">separator</text>
    <rect x="458" y="128" width="44" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="480" y="98" text-anchor="middle" font-size="11" fill="#000">Trommel</text><text x="480" y="111" text-anchor="middle" font-size="11" fill="#000">screen</text>
    <rect x="568" y="128" width="44" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>    <text x="590" y="98" text-anchor="middle" font-size="11" fill="#000">Secondary air</text><text x="590" y="111" text-anchor="middle" font-size="11" fill="#000">classifier</text>
