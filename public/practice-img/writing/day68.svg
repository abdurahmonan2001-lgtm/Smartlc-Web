<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="Arial, sans-serif">
  <rect width="680" height="410" fill="#ffffff"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">How recycled paper is made</text>
  <g fill="#000">
    <rect x="20" y="44" width="110" height="82" fill="#e8eef3" stroke="#333" stroke-width="1"/>    <text x="75" y="80" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">1. Making</text><text x="75" y="93" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">pulp</text>
    <rect x="150" y="59" width="160" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="230" y="82.8" text-anchor="middle" font-size="10.5">Used paper carried</text><text x="230" y="95.3" text-anchor="middle" font-size="10.5">on a conveyor belt</text>
    <line x1="312" y1="85" x2="350" y2="85" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="352" y="59" width="300" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="502" y="82.8" text-anchor="middle" font-size="10.5">Dropped into a tank of water and</text><text x="502" y="95.3" text-anchor="middle" font-size="10.5">chemicals: unfiltered pulp</text>
    <line x1="502" y1="113" x2="502" y2="145" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="20" y="136" width="110" height="82" fill="#e8eef3" stroke="#333" stroke-width="1"/>    <text x="75" y="172" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">2. Filtering</text>
    <rect x="352" y="147" width="300" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="502" y="170.8" text-anchor="middle" font-size="10.5">Pulp filtered through a sieve</text><text x="502" y="183.3" text-anchor="middle" font-size="10.5">into a tank: filtered pulp</text>
    <line x1="350" y1="173" x2="312" y2="173" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="150" y="147" width="160" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="230" y="177" text-anchor="middle" font-size="10.5">Ink drained off</text>
    <line x1="502" y1="201" x2="502" y2="233" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="20" y="228" width="110" height="82" fill="#e8eef3" stroke="#333" stroke-width="1"/>    <text x="75" y="264" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">3. Cleaning</text>
    <rect x="352" y="235" width="300" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="502" y="258.8" text-anchor="middle" font-size="10.5">Washed with water and soap,</text><text x="502" y="271.3" text-anchor="middle" font-size="10.5">with air pumped in</text>
    <line x1="350" y1="261" x2="312" y2="261" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="150" y="235" width="160" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="230" y="258.8" text-anchor="middle" font-size="10.5">Then water and</text><text x="230" y="271.3" text-anchor="middle" font-size="10.5">chemicals: cleaned pulp</text>
    <line x1="230" y1="289" x2="230" y2="321" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="20" y="320" width="110" height="82" fill="#e8eef3" stroke="#333" stroke-width="1"/>    <text x="75" y="356" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">4. Making</text><text x="75" y="369" text-anchor="middle" font-size="12" fill="#000" font-weight="bold">paper</text>
    <rect x="150" y="323" width="210" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="255" y="346.8" text-anchor="middle" font-size="10.5">Spread on a conveyor belt;</text><text x="255" y="359.3" text-anchor="middle" font-size="10.5">water drained</text>
    <line x1="362" y1="349" x2="400" y2="349" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="402" y="323" width="140" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="472" y="346.8" text-anchor="middle" font-size="10.5">Dried by</text><text x="472" y="359.3" text-anchor="middle" font-size="10.5">heated rollers</text>
    <line x1="544" y1="349" x2="570" y2="349" stroke="#333" stroke-width="1.4" marker-end="url(#ah)"/>
    <rect x="572" y="323" width="90" height="52" fill="#f6f8f7" stroke="#333" stroke-width="1.2"/><text x="617" y="346.8" text-anchor="middle" font-size="10.5">Recycled</text><text x="617" y="359.3" text-anchor="middle" font-size="10.5">paper</text>
  </g>
</svg>
