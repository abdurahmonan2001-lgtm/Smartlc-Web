<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Halton city centre — cycle-hire scheme</text>

  <!-- river across the top -->
  <rect x="20" y="40" width="600" height="36" fill="#e6eef4" stroke="#8a8a8a"/>
  <text x="90" y="62" font-size="12" fill="#333" font-style="italic">River</text>

  <!-- Station Road (vertical) with bridge over the river -->
  <rect x="298" y="36" width="44" height="44" fill="#f2f2f2" stroke="#8a8a8a"/>
  <text x="320" y="34" text-anchor="middle" font-size="10" fill="#333">Bridge</text>
  <rect x="298" y="80" width="44" height="300" fill="#f2f2f2" stroke="#bbbbbb"/>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90 320 160)">Station Road</text>

  <!-- High Street (horizontal) -->
  <rect x="20" y="200" width="600" height="40" fill="#f2f2f2" stroke="#bbbbbb"/>
  <text x="105" y="224" text-anchor="middle" font-size="11" fill="#555">High Street</text>

  <!-- buildings and places -->
  <rect x="180" y="106" width="100" height="72" fill="#ffffff" stroke="#595959"/>
  <text x="230" y="138" text-anchor="middle" font-size="11" fill="#333">Town</text>
  <text x="230" y="152" text-anchor="middle" font-size="11" fill="#333">Hall</text>

  <rect x="360" y="106" width="100" height="72" fill="#ffffff" stroke="#595959"/>
  <text x="410" y="145" text-anchor="middle" font-size="11" fill="#333">Museum</text>

  <rect x="480" y="88" width="130" height="98" fill="#eaf4ea" stroke="#8a8a8a"/>
  <text x="545" y="140" text-anchor="middle" font-size="11" fill="#333">Park</text>

  <rect x="60" y="262" width="130" height="92" fill="#f7f7f7" stroke="#8a8a8a"/>
  <text x="125" y="288" text-anchor="middle" font-size="11" fill="#333">Market</text>
  <text x="125" y="302" text-anchor="middle" font-size="11" fill="#333">Square</text>

  <rect x="470" y="262" width="140" height="70" fill="#ffffff" stroke="#595959"/>
  <text x="540" y="300" text-anchor="middle" font-size="11" fill="#333">Supermarket</text>

  <rect x="250" y="340" width="140" height="44" fill="#ffffff" stroke="#595959"/>
  <text x="320" y="358" text-anchor="middle" font-size="11" fill="#333">Railway</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#333">Station</text>

  <!-- lettered locations -->
  <g stroke="#000000" fill="#ffffff">
    <circle cx="497" cy="193" r="13"/>
    <circle cx="150" cy="92" r="13"/>
    <circle cx="222" cy="362" r="13"/>
    <circle cx="356" cy="190" r="13"/>
    <circle cx="230" cy="190" r="13"/>
    <circle cx="125" cy="330" r="13"/>
    <circle cx="595" cy="220" r="13"/>
    <circle cx="410" cy="252" r="13"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#000" text-anchor="middle">
    <text x="497" y="198">A</text>
    <text x="150" y="97">B</text>
    <text x="222" y="367">C</text>
    <text x="356" y="195">D</text>
    <text x="230" y="195">E</text>
    <text x="125" y="335">F</text>
    <text x="595" y="225">G</text>
    <text x="410" y="257">H</text>
  </g>
</svg>
