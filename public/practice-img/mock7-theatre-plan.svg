<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Grand Avenue Community Theatre — ground floor</text>
  <rect x="20" y="44" width="600" height="340" fill="none" stroke="#595959" stroke-width="2"/>

  <!-- top row: room A, stage, room B -->
  <rect x="30" y="54" width="140" height="70" fill="#fff" stroke="#595959"/>
  <text x="100" y="95" text-anchor="middle" font-size="18" font-weight="bold">A</text>
  <rect x="190" y="54" width="260" height="70" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="320" y="95" text-anchor="middle" font-size="12" fill="#333">Stage</text>
  <rect x="470" y="54" width="140" height="70" fill="#fff" stroke="#595959"/>
  <text x="540" y="95" text-anchor="middle" font-size="18" font-weight="bold">B</text>

  <!-- middle band: left rooms C/D, auditorium, right rooms E/F -->
  <rect x="30" y="134" width="110" height="60" fill="#fff" stroke="#595959"/>
  <text x="85" y="170" text-anchor="middle" font-size="18" font-weight="bold">C</text>
  <rect x="30" y="204" width="110" height="60" fill="#fff" stroke="#595959"/>
  <text x="85" y="240" text-anchor="middle" font-size="18" font-weight="bold">D</text>
  <rect x="160" y="134" width="320" height="130" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="320" y="204" text-anchor="middle" font-size="12" fill="#333">Auditorium</text>
  <rect x="500" y="134" width="110" height="60" fill="#fff" stroke="#595959"/>
  <text x="555" y="170" text-anchor="middle" font-size="18" font-weight="bold">E</text>
  <rect x="500" y="204" width="110" height="60" fill="#fff" stroke="#595959"/>
  <text x="555" y="240" text-anchor="middle" font-size="18" font-weight="bold">F</text>

  <!-- bottom row: room G, foyer, room H -->
  <rect x="30" y="274" width="140" height="100" fill="#fff" stroke="#595959"/>
  <text x="100" y="329" text-anchor="middle" font-size="18" font-weight="bold">G</text>
  <rect x="190" y="274" width="260" height="100" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="320" y="329" text-anchor="middle" font-size="12" fill="#333">Foyer</text>
  <rect x="470" y="274" width="140" height="100" fill="#fff" stroke="#595959"/>
  <text x="540" y="329" text-anchor="middle" font-size="18" font-weight="bold">H</text>

  <!-- entrance -->
  <rect x="270" y="376" width="100" height="8" fill="#fff" stroke="#595959"/>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#333">Main entrance</text>
</svg>
