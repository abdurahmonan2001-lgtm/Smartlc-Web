<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Riverside Library — ground floor</text>
  <rect x="20" y="44" width="600" height="340" fill="none" stroke="#595959" stroke-width="2"/>

  <!-- back row -->
  <rect x="30" y="54" width="180" height="84" fill="#fff" stroke="#595959"/>
  <text x="120" y="102" text-anchor="middle" font-size="18" font-weight="bold">A</text>
  <rect x="230" y="54" width="180" height="84" fill="#fff" stroke="#595959"/>
  <text x="320" y="102" text-anchor="middle" font-size="18" font-weight="bold">B</text>
  <rect x="430" y="54" width="180" height="84" fill="#fff" stroke="#595959"/>
  <text x="520" y="102" text-anchor="middle" font-size="18" font-weight="bold">C</text>

  <!-- middle: D on the left, the stairs in the centre with H directly behind them
       (on the side away from the entrance), E on the right. Corridors keep D and E
       clear of the stairs, so only H is "beside the stairs, on the far side". -->
  <rect x="30" y="164" width="160" height="90" fill="#fff" stroke="#595959"/>
  <text x="110" y="215" text-anchor="middle" font-size="18" font-weight="bold">D</text>
  <rect x="270" y="150" width="100" height="40" fill="#fff" stroke="#595959"/>
  <text x="320" y="177" text-anchor="middle" font-size="18" font-weight="bold">H</text>
  <rect x="270" y="194" width="100" height="62" fill="#eef2f1" stroke="#8a8a8a"/>
  <g stroke="#b5bcba" stroke-width="1">
    <line x1="270" y1="206" x2="370" y2="206"/><line x1="270" y1="218" x2="370" y2="218"/>
    <line x1="270" y1="230" x2="370" y2="230"/><line x1="270" y1="242" x2="370" y2="242"/>
  </g>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#333">Stairs</text>
  <rect x="450" y="164" width="160" height="90" fill="#fff" stroke="#595959"/>
  <text x="530" y="215" text-anchor="middle" font-size="18" font-weight="bold">E</text>

  <!-- front row: café, F, info desk, G -->
  <rect x="30" y="274" width="110" height="100" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="85" y="328" text-anchor="middle" font-size="12" fill="#333">Café</text>
  <rect x="150" y="274" width="130" height="100" fill="#fff" stroke="#595959"/>
  <text x="215" y="329" text-anchor="middle" font-size="18" font-weight="bold">F</text>
  <rect x="290" y="274" width="120" height="54" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="350" y="298" text-anchor="middle" font-size="11" fill="#333">Information</text>
  <text x="350" y="312" text-anchor="middle" font-size="11" fill="#333">desk</text>
  <rect x="430" y="274" width="180" height="100" fill="#fff" stroke="#595959"/>
  <text x="520" y="329" text-anchor="middle" font-size="18" font-weight="bold">G</text>

  <!-- entrance -->
  <rect x="300" y="376" width="100" height="8" fill="#fff" stroke="#595959"/>
  <text x="350" y="404" text-anchor="middle" font-size="12" fill="#333">Main entrance</text>
</svg>
