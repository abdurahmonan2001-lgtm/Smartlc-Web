<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">Riverside Library — ground floor</text>
  <rect x="20" y="44" width="600" height="340" fill="none" stroke="#595959" stroke-width="2"/>

  <!-- back row -->
  <rect x="30" y="54" width="180" height="90" fill="#fff" stroke="#595959"/>
  <text x="120" y="105" text-anchor="middle" font-size="18" font-weight="bold">A</text>
  <rect x="230" y="54" width="180" height="90" fill="#fff" stroke="#595959"/>
  <text x="320" y="105" text-anchor="middle" font-size="18" font-weight="bold">B</text>
  <rect x="430" y="54" width="180" height="90" fill="#fff" stroke="#595959"/>
  <text x="520" y="105" text-anchor="middle" font-size="18" font-weight="bold">C</text>

  <!-- middle row: D, stairs + H, E -->
  <rect x="30" y="164" width="180" height="90" fill="#fff" stroke="#595959"/>
  <text x="120" y="215" text-anchor="middle" font-size="18" font-weight="bold">D</text>
  <rect x="250" y="164" width="80" height="90" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="290" y="212" text-anchor="middle" font-size="11" fill="#333">Stairs</text>
  <rect x="340" y="164" width="70" height="90" fill="#fff" stroke="#595959"/>
  <text x="375" y="215" text-anchor="middle" font-size="18" font-weight="bold">H</text>
  <rect x="430" y="164" width="180" height="90" fill="#fff" stroke="#595959"/>
  <text x="520" y="215" text-anchor="middle" font-size="18" font-weight="bold">E</text>

  <!-- front row: café, F, info desk, G -->
  <rect x="30" y="274" width="110" height="100" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="85" y="328" text-anchor="middle" font-size="12" fill="#333">Café</text>
  <rect x="150" y="274" width="130" height="100" fill="#fff" stroke="#595959"/>
  <text x="215" y="329" text-anchor="middle" font-size="18" font-weight="bold">F</text>
  <rect x="290" y="274" width="120" height="54" fill="#eef2f1" stroke="#8a8a8a"/>
  <text x="350" y="298" text-anchor="middle" font-size="11" fill="#333">Information</text>
  <text x="350" y="312" text-anchor="middle" font-size="11" fill="#333">desk</text>
  <rect x="430" y="274" width="180" height="100" fill="#fff" stroke="#595959"/>
  <text x="520" y="329" text-anchor="middle" font-size="18" font-weight="bold">G</text>

  <!-- entrance -->
  <rect x="300" y="376" width="100" height="8" fill="#fff" stroke="#595959"/>
  <text x="350" y="404" text-anchor="middle" font-size="12" fill="#333">Main entrance</text>
</svg>
