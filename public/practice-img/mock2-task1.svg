<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">Household internet access in three countries, 2005–2025 (%)</text>

  <!-- axes -->
  <line x1="70" y1="330" x2="590" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="70" y2="50" stroke="#333" stroke-width="1.5"/>
  <!-- y grid + labels -->
  <g font-size="11" fill="#555">
    <line x1="70" y1="50" x2="590" y2="50" stroke="#e5e5e5"/><text x="60" y="54" text-anchor="end">100</text>
    <line x1="70" y1="120" x2="590" y2="120" stroke="#e5e5e5"/><text x="60" y="124" text-anchor="end">75</text>
    <line x1="70" y1="190" x2="590" y2="190" stroke="#e5e5e5"/><text x="60" y="194" text-anchor="end">50</text>
    <line x1="70" y1="260" x2="590" y2="260" stroke="#e5e5e5"/><text x="60" y="264" text-anchor="end">25</text>
    <text x="60" y="334" text-anchor="end">0</text>
  </g>
  <!-- x labels: 2005 2010 2015 2020 2025 -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="348">2005</text>
    <text x="200" y="348">2010</text>
    <text x="330" y="348">2015</text>
    <text x="460" y="348">2020</text>
    <text x="590" y="348">2025</text>
  </g>

  <!-- Country A (Norland): 62 → 75 → 86 → 93 → 96 -->
  <polyline points="70,156 200,120 330,89 460,70 590,61" fill="none" stroke="#1d3a6b" stroke-width="2.5"/>
  <!-- Country B (Sudonia): 18 → 34 → 58 → 78 → 88 -->
  <polyline points="70,280 200,235 330,168 460,112 590,84" fill="none" stroke="#009472" stroke-width="2.5" stroke-dasharray="7 4"/>
  <!-- Country C (Westia): 8 → 12 → 22 → 45 → 71 -->
  <polyline points="70,308 200,296 330,268 460,204 590,131" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 4"/>

  <!-- legend -->
  <g font-size="12" fill="#000">
    <line x1="90" y1="66" x2="120" y2="66" stroke="#1d3a6b" stroke-width="2.5"/><text x="126" y="70">Norland</text>
    <line x1="200" y1="66" x2="230" y2="66" stroke="#009472" stroke-width="2.5" stroke-dasharray="7 4"/><text x="236" y="70">Sudonia</text>
    <line x1="310" y1="66" x2="340" y2="66" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 4"/><text x="346" y="70">Westia</text>
  </g>
</svg>
